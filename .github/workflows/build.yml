name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Android toolchain
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          SDKMANAGER="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.1.12297006" "build-tools;35.0.0" "platforms;android-36" "cmake;3.22.1" >/dev/null

      - name: Flutter analysis
        run: |
          flutter pub get
          flutter analyze

      - name: Host bridge and battle policy tests (ASAN / UBSAN)
        run: bash scripts/test-translated-engine.sh

      - name: Waydroid x86_64 APK (with ARM64 guest)
        run: bash scripts/build-waydroid.sh

      - name: APK signature and checksum
        working-directory: build
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify zoot-waydroid-x64.apk
          sha256sum zoot-waydroid-x64.apk > SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zoot-waydroid-x64
          path: |
            build/zoot-waydroid-x64.apk
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zoot-waydroid-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/zoot-waydroid-x64.apk
            release/SHA256SUMS
          generate_release_notes: true
